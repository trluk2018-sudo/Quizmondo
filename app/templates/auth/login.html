<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In &mdash; SiteBuilder Express</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
</head>
<body class="flex min-h-full items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-sm space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">SiteBuilder Express</h1>
      <p class="mt-1 text-xs text-slate-500">Sign in to manage your website</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="space-y-2">
      {% for category, msg in messages %}
      <div class="p-3 text-xs rounded border {% if category == 'error' %}bg-red-50 text-red-700 border-red-200{% else %}bg-blue-50 text-blue-700 border-blue-200{% endif %}">
        {{ msg }}
      </div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="bg-white p-6 border border-slate-200 shadow-sm rounded-lg">
      <form class="space-y-4" method="POST">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wide">Username or Email</label>
          <input type="text" name="username" required autofocus class="mt-1 block w-full rounded border-slate-300 text-sm focus:border-blue-500 focus:ring-blue-500 py-1.5 px-3 border">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wide">Password</label>
          <input type="password" name="password" required class="mt-1 block w-full rounded border-slate-300 text-sm focus:border-blue-500 focus:ring-blue-500 py-1.5 px-3 border">
        </div>

        <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
          Log In
        </button>
      </form>
    </div>

    <div class="text-center text-xs text-slate-400">
      <a href="{{ url_for('public.home') }}" class="hover:text-slate-600">&larr; Back to Website</a>
    </div>
  </div>
</body>
</html>
