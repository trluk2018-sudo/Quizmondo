{% extends "admin/base.html" %}

{% block title %}Reading Settings{% endblock %}

{% block content %}
<form method="POST" class="max-w-3xl space-y-6">
  <div class="border-b border-slate-200 pb-4">
    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Reading Settings</h1>
    <p class="text-xs text-slate-500 mt-1">Control what appears on your website front page and archive feeds.</p>
  </div>

  <div class="bg-white border border-slate-200 p-6 space-y-6">
    <div>
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-900 mb-3">Your homepage displays</h2>
      
      <div class="space-y-5">
        <!-- Option 1: Modular Home Page Layout & Sections (Recommended) -->
        <label class="flex items-start gap-3 p-4 rounded-xl border-2 cursor-pointer transition {% if settings.get('homepage_type', 'posts') in ('posts', 'modular') %}border-blue-600 bg-blue-50/40 ring-1 ring-blue-200{% else %}border-slate-200 hover:border-slate-300{% endif %}">
          <input type="radio" name="homepage_type" value="posts" {% if settings.get('homepage_type', 'posts') in ('posts', 'modular') %}checked{% endif %} class="mt-1 text-blue-600 border-slate-300 focus:ring-blue-500">
          <div class="space-y-1.5 flex-1">
            <div class="flex items-center gap-2">
              <span class="text-sm font-bold text-slate-900">Home Page Layout and Sections</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 uppercase">Recommended Default</span>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed">
              Renders your high-impact modular homepage with custom Hero video/banner, capability grids, case studies, client stories, and trust badges.
            </p>
            <div class="pt-2 flex items-center gap-2 text-xs">
              <a href="{{ url_for('admin.layout') }}" class="inline-flex items-center gap-1.5 font-semibold text-blue-700 hover:text-blue-900 hover:underline">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                Customize Layout, Modules, Video &amp; Colors in Home Page Layout and Sections &rarr;
              </a>
            </div>
          </div>
        </label>

        <!-- Option 2: Classic Blog Archive Stream -->
        <label class="flex items-start gap-3 p-4 rounded-xl border cursor-pointer transition {% if settings.get('homepage_type') == 'blog_feed' %}border-blue-600 bg-blue-50/40 ring-1 ring-blue-200{% else %}border-slate-200 hover:border-slate-300{% endif %}">
          <input type="radio" name="homepage_type" value="blog_feed" {% if settings.get('homepage_type') == 'blog_feed' %}checked{% endif %} class="mt-1 text-blue-600 border-slate-300 focus:ring-blue-500">
          <div>
            <span class="text-sm font-bold text-slate-900">Classic Blog Feed (Archive Stream)</span>
            <p class="text-xs text-slate-500 mt-0.5">Displays a chronological listing of published dispatches and articles directly at the root address (/).</p>
          </div>
        </label>

        <!-- Option 3: Static Custom Page -->
        <label class="flex items-start gap-3 p-4 rounded-xl border cursor-pointer transition {% if settings.get('homepage_type') == 'page' %}border-blue-600 bg-blue-50/40 ring-1 ring-blue-200{% else %}border-slate-200 hover:border-slate-300{% endif %}">
          <input type="radio" name="homepage_type" value="page" {% if settings.get('homepage_type') == 'page' %}checked{% endif %} class="mt-1 text-blue-600 border-slate-300 focus:ring-blue-500">
          <div class="space-y-2 flex-1">
            <span class="text-sm font-bold text-slate-900">A static custom page</span>
            <p class="text-xs text-slate-500">Pick any custom page to serve directly as the homepage.</p>

            <div class="pt-1">
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wide mb-1">Select Homepage Page:</label>
              <select name="homepage_page_id" class="text-xs border border-slate-300 rounded px-3 py-2 w-full sm:w-80 bg-white">
                <option value="">-- Choose a page --</option>
                {% for p in pages %}
                <option value="{{ p.id }}" {% if settings.get('homepage_page_id') == p.id|string %}selected{% endif %}>{{ p.title }} (slug: /{{ p.slug }})</option>
                {% endfor %}
              </select>
            </div>
          </div>
        </label>
      </div>
    </div>

    <div class="border-t border-slate-100 pt-5">
      <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wide mb-1">Blog pages show at most</label>
      <div class="flex items-center gap-2 text-xs">
        <input type="number" name="posts_per_page" value="{{ settings.get('posts_per_page', '10') }}" min="1" max="50" class="w-20 px-2 py-1 border border-slate-300 rounded font-mono">
        <span class="text-slate-500">posts per page</span>
      </div>
    </div>
  </div>

  <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded shadow-sm transition">
    Save Reading Settings
  </button>
</form>
{% endblock %}
