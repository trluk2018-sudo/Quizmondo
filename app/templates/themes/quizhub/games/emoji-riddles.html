{% extends "themes/quizhub/games/_shell.html" %}

{% block game_stage %}
<div class="space-y-3">
  <div class="p-5 sm:p-7 rounded-3xl bg-slate-950/95 border-2 border-orange-500/35 shadow-2xl space-y-5 text-center relative overflow-hidden">
    <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-64 h-32 bg-orange-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative space-y-4">
      <span class="inline-block px-2.5 py-0.5 rounded-full bg-orange-500/20 text-orange-200 text-[10px] font-black uppercase font-mono border border-orange-500/30">
        <span id="erCategory">—</span>
      </span>

      <div id="erEmoji" class="qmg-nosel text-5xl sm:text-6xl py-3 leading-tight tracking-widest">—</div>

      <!-- Letter pattern reveals as hints are burned -->
      <div id="erPattern" class="font-mono font-black text-base sm:text-xl text-cyan-300 tracking-[0.25em] break-words min-h-[28px]"></div>

      <form id="erForm" autocomplete="off" class="space-y-2.5">
        <input id="erInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters"
               spellcheck="false" maxlength="40" placeholder="What is it?"
               class="w-full px-4 py-3.5 rounded-2xl bg-slate-900/95 border-2 border-purple-500/30 text-white text-center font-mono font-black text-base uppercase placeholder:text-sm placeholder:font-normal placeholder:normal-case placeholder-slate-500 focus:outline-none focus:border-cyan-400">
        <div class="grid grid-cols-3 gap-2">
          <button type="button" id="erHint" class="py-3 rounded-2xl bg-slate-900 border border-amber-500/30 text-amber-300 font-mono font-bold text-[11px] uppercase hover:border-amber-400 transition">
            💡 Hint
          </button>
          <button type="submit" class="py-3 rounded-2xl bg-gradient-to-r from-orange-500 to-rose-600 hover:from-orange-400 hover:to-rose-500 text-slate-950 font-mono font-black text-[11px] uppercase tracking-wider shadow-lg transition">
            Guess
          </button>
          <button type="button" id="erPass" class="py-3 rounded-2xl bg-slate-900 border border-purple-500/30 text-rose-300 font-mono font-bold text-[11px] uppercase hover:border-rose-400 transition">
            Pass ⏭
          </button>
        </div>
      </form>

      <!-- Our own keys: the device keyboard covers too much of a phone -->
      <div id="erKeys" class="pt-1"></div>

      <div id="erFeedback" class="min-h-[18px] font-mono text-xs font-bold"></div>
    </div>
  </div>

  <div class="flex items-center justify-between px-4 py-2.5 rounded-2xl bg-slate-950/80 border border-purple-500/20 font-mono text-[11px]">
    <span class="text-slate-400">Riddle <strong id="erProgress" class="text-cyan-300">1</strong>/<strong id="erTotal" class="text-cyan-300">0</strong></span>
    <span class="text-slate-400">Solved: <strong id="erGot" class="text-emerald-300">0</strong></span>
    <span class="text-slate-400">Hints: <strong id="erHints" class="text-amber-300">0</strong></span>
  </div>
</div>
{% endblock %}

{% block game_js %}
<script>
(function () {
  var BANK = {{ bank|tojson }};
  var ROUND_SECONDS = 150;

  var catEl = document.getElementById('erCategory');
  var emojiEl = document.getElementById('erEmoji');
  var patternEl = document.getElementById('erPattern');
  var inputEl = document.getElementById('erInput');
  var feedbackEl = document.getElementById('erFeedback');
  var progressEl = document.getElementById('erProgress');
  var totalEl = document.getElementById('erTotal');
  var gotEl = document.getElementById('erGot');
  var hintsEl = document.getElementById('erHints');

  var queue = [];
  var current = null;
  var revealed = [];
  var got = 0, done = 0, total = 0, hintsUsed = 0;
  var running = false;

  function paintPattern() {
    if (!current) { patternEl.textContent = ''; return; }
    var out = current.answer.split('').map(function (ch, i) {
      if (ch === ' ') return '  ';
      return revealed.indexOf(i) !== -1 ? ch : '_';
    }).join('');
    patternEl.textContent = out;
  }

  function say(text, good) {
    feedbackEl.textContent = text;
    feedbackEl.className = 'min-h-[18px] font-mono text-xs font-bold ' + (good ? 'text-emerald-300' : 'text-rose-300');
    setTimeout(function () {
      if (feedbackEl.textContent === text) feedbackEl.textContent = '';
    }, 1600);
  }

  function nextRiddle() {
    if (!queue.length) { finishUp(true); return; }
    current = queue.shift();
    current.answer = current.answer.toUpperCase();
    revealed = [];
    catEl.textContent = current.category;
    emojiEl.textContent = current.emoji;
    emojiEl.classList.remove('qmg-grow');
    void emojiEl.offsetWidth;
    emojiEl.classList.add('qmg-grow');
    paintPattern();
    inputEl.value = '';
    progressEl.textContent = Math.min(done + 1, total);
    QMG.softFocus(inputEl);
  }

  document.getElementById('erForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!running || !current) return;
    var guess = QMG.normalise(inputEl.value);
    if (!guess) return;

    if (guess === QMG.normalise(current.answer)) {
      got += 1; done += 1;
      gotEl.textContent = got;
      QMG.reward();
      var base = 100 - revealed.length * 15;
      var points = Math.max(20, Math.round(base * QMG.comboMultiplier()));
      QMG.addScore(points, emojiEl);
      QMG.audio.correct();
      QMG.haptic(25);
      QMG.addTime(4);
      say('✅ ' + current.answer + ' — +' + points, true);
      nextRiddle();
    } else {
      QMG.resetCombo();
      QMG.audio.wrong();
      QMG.shake(inputEl);
      say('Nope — look again', false);
      inputEl.select();
    }
  });

  document.getElementById('erHint').addEventListener('click', function () {
    if (!running || !current) return;
    var hidden = [];
    for (var i = 0; i < current.answer.length; i++) {
      if (current.answer[i] !== ' ' && revealed.indexOf(i) === -1) hidden.push(i);
    }
    if (!hidden.length) return;
    revealed.push(QMG.pick(hidden));
    hintsUsed += 1;
    hintsEl.textContent = hintsUsed;
    paintPattern();
    QMG.audio.tick();
    QMG.softFocus(inputEl);
  });

  document.getElementById('erPass').addEventListener('click', function () {
    if (!running || !current) return;
    done += 1;
    QMG.resetCombo();
    QMG.audio.switchTurn();
    say('It was ' + current.answer, false);
    nextRiddle();
  });

  function finishUp(cleared) {
    running = false;
    inputEl.blur();
    QMG.finish({
      win: got > 0,
      icon: cleared ? '🏆' : (got > 0 ? '🧐' : '⏱️'),
      title: cleared ? 'Every Riddle Solved!' : (got > 0 ? 'Time! Good going' : 'Time Up'),
      sub: got + ' of ' + total + ' riddles cracked.',
      detail: hintsUsed ? ['Hints used: ' + hintsUsed] : []
    });
  }

  function start() {
    queue = QMG.shuffle(BANK);
    total = queue.length;
    totalEl.textContent = total;
    got = 0; done = 0; hintsUsed = 0;
    gotEl.textContent = '0';
    hintsEl.textContent = '0';
    feedbackEl.textContent = '';
    running = true;
    nextRiddle();
    QMG.startTimer(ROUND_SECONDS, function () { finishUp(false); });
  }

  QMG.onReplay(start);
  start();

  QMG.attachKeyboard(
    document.getElementById('erKeys'),
    document.getElementById('erInput'),
    document.getElementById('erForm'),
    { enterLabel: 'ENTER' }
  );
})();
</script>
{% endblock %}
