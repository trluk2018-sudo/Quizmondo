{% extends "themes/quizhub/games/_shell.html" %}

{% block game_stage %}
<div class="space-y-3">
  <div class="p-5 sm:p-7 rounded-3xl bg-slate-950/95 border-2 border-cyan-500/35 shadow-2xl space-y-5 text-center relative overflow-hidden">
    <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-64 h-32 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative space-y-4">
      <div class="flex items-center justify-center gap-2 font-mono">
        <span class="px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 text-[10px] font-black uppercase border border-cyan-500/30">
          Clue: <span id="anHint">—</span>
        </span>
        <span class="px-2.5 py-0.5 rounded-full bg-slate-900 text-slate-400 text-[10px] font-black uppercase border border-purple-500/25">
          <span id="anLen">0</span> letters
        </span>
      </div>

      <!-- Scrambled letters -->
      <div id="anLetters" class="qmg-nosel flex flex-wrap justify-center gap-1.5 sm:gap-2 min-h-[52px]"></div>

      <form id="anForm" autocomplete="off" class="space-y-2.5">
        <input id="anInput" type="text" inputmode="text" autocomplete="off" autocorrect="off"
               autocapitalize="characters" spellcheck="false" maxlength="14"
               placeholder="Type the word"
               class="w-full px-4 py-3.5 rounded-2xl bg-slate-900/95 border-2 border-purple-500/30 text-white text-center font-mono font-black text-lg tracking-[0.2em] uppercase placeholder:tracking-normal placeholder:text-sm placeholder:font-normal placeholder-slate-500 focus:outline-none focus:border-cyan-400">
        <div class="grid grid-cols-3 gap-2">
          <button type="button" id="anShuffle" class="py-3 rounded-2xl bg-slate-900 border border-purple-500/30 text-slate-300 font-mono font-bold text-[11px] uppercase hover:border-cyan-400 transition">
            🔀 Shuffle
          </button>
          <button type="submit" class="py-3 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-slate-950 font-mono font-black text-[11px] uppercase tracking-wider shadow-lg transition">
            Submit
          </button>
          <button type="button" id="anSkip" class="py-3 rounded-2xl bg-slate-900 border border-purple-500/30 text-rose-300 font-mono font-bold text-[11px] uppercase hover:border-rose-400 transition">
            Skip ⏭
          </button>
        </div>
      </form>

      <!-- The keys are this word's own letters; a full alphabet
           here would be twenty spare keys to look past -->
      <div id="anKeys" class="pt-1"></div>

      <div id="anFeedback" class="min-h-[18px] font-mono text-xs font-bold"></div>
    </div>
  </div>

  <div class="flex items-center justify-between px-4 py-2.5 rounded-2xl bg-slate-950/80 border border-purple-500/20 font-mono text-[11px]">
    <span class="text-slate-400">Solved: <strong id="anSolved" class="text-emerald-300">0</strong></span>
    <span class="text-slate-400">Skipped: <strong id="anSkipped" class="text-rose-300">0</strong></span>
    <span class="text-slate-400">+3s per correct</span>
  </div>
</div>
{% endblock %}

{% block game_js %}
<script>
(function () {
  var BANK = {{ bank|tojson }};
  var ROUND_SECONDS = 90;

  var lettersEl = document.getElementById('anLetters');
  var hintEl = document.getElementById('anHint');
  var lenEl = document.getElementById('anLen');
  var inputEl = document.getElementById('anInput');
  var formEl = document.getElementById('anForm');
  var feedbackEl = document.getElementById('anFeedback');
  var solvedEl = document.getElementById('anSolved');
  var skippedEl = document.getElementById('anSkipped');

  var queue = [];
  var current = null;
  var solved = 0;
  var skipped = 0;
  var running = false;

  function scramble(word) {
    var letters = word.split('');
    for (var attempt = 0; attempt < 20; attempt++) {
      letters = QMG.shuffle(letters);
      if (letters.join('') !== word) break;
    }
    return letters;
  }

  function paintLetters(letters) {
    lettersEl.innerHTML = '';
    letters.forEach(function (ch, i) {
      var tile = document.createElement('span');
      tile.className = 'w-9 h-11 sm:w-10 sm:h-12 rounded-xl bg-gradient-to-br from-purple-700 to-indigo-800 border border-purple-400/40 ' +
                       'flex items-center justify-center font-mono font-black text-lg sm:text-xl text-white shadow-lg qmg-grow';
      tile.style.animationDelay = (i * 35) + 'ms';
      tile.textContent = ch;
      lettersEl.appendChild(tile);
    });
  }

  function nextWord() {
    if (!queue.length) { queue = QMG.shuffle(BANK); }
    current = queue.shift();
    current.scrambled = scramble(current.word);
    hintEl.textContent = current.hint;
    lenEl.textContent = current.word.length;
    paintLetters(current.scrambled);
    inputEl.value = '';
    if (keys) keys.setRows(letterRows(current.scrambled));
    QMG.softFocus(inputEl);
  }

  function say(text, good) {
    feedbackEl.textContent = text;
    feedbackEl.className = 'min-h-[18px] font-mono text-xs font-bold ' + (good ? 'text-emerald-300' : 'text-rose-300');
    setTimeout(function () {
      if (feedbackEl.textContent === text) { feedbackEl.textContent = ''; }
    }, 1400);
  }

  formEl.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!running || !current) return;
    var guess = QMG.normalise(inputEl.value);
    if (!guess) return;

    if (guess === current.word) {
      solved += 1;
      solvedEl.textContent = solved;
      QMG.reward();
      var points = Math.round((40 + current.word.length * 12) * QMG.comboMultiplier());
      QMG.addScore(points, lettersEl);
      QMG.audio.correct();
      QMG.haptic(25);
      QMG.addTime(3);
      say('✅ ' + current.word + ' — +' + points, true);
      nextWord();
    } else {
      QMG.resetCombo();
      QMG.audio.wrong();
      QMG.shake(inputEl);
      QMG.haptic(50);
      say('Not quite — keep going', false);
      inputEl.select();
    }
  });

  document.getElementById('anShuffle').addEventListener('click', function () {
    if (!current) return;
    current.scrambled = QMG.shuffle(current.scrambled);
    paintLetters(current.scrambled);
    QMG.audio.tick();
    inputEl.focus({ preventScroll: true });
  });

  document.getElementById('anSkip').addEventListener('click', function () {
    if (!running || !current) return;
    skipped += 1;
    skippedEl.textContent = skipped;
    QMG.resetCombo();
    QMG.audio.switchTurn();
    say('It was ' + current.word, false);
    nextWord();
  });

  function timeUp() {
    running = false;
    inputEl.blur();
    QMG.finish({
      win: solved > 0,
      icon: solved > 0 ? '🔀' : '⏱️',
      title: solved > 0 ? 'Time! Well played' : 'Time Up',
      sub: solved + ' word' + (solved === 1 ? '' : 's') + ' unscrambled in 90 seconds.',
      detail: skipped ? ['Skipped: ' + skipped] : []
    });
  }

  function start() {
    queue = QMG.shuffle(BANK);
    solved = 0; skipped = 0;
    solvedEl.textContent = '0';
    skippedEl.textContent = '0';
    feedbackEl.textContent = '';
    running = true;
    nextWord();
    QMG.startTimer(ROUND_SECONDS, timeUp);
  }

  // Split the letters over one or two rows so they stay thumb sized.
  function letterRows(letters) {
    var all = letters.join ? letters.join('') : String(letters);
    if (all.length <= 6) return [all];
    var half = Math.ceil(all.length / 2);
    return [all.slice(0, half), all.slice(half)];
  }

  var keys = QMG.attachKeyboard(
    document.getElementById('anKeys'),
    inputEl,
    formEl,
    { enterLabel: 'ENTER', rows: [''] }
  );

  QMG.onReplay(start);
  start();
})();
</script>
{% endblock %}
