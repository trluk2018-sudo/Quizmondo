{% extends "themes/quizhub/games/_shell.html" %}

{% block game_stage %}
<div class="space-y-3">
  <div class="p-5 sm:p-7 rounded-3xl bg-slate-950/95 border-2 border-blue-500/35 shadow-2xl space-y-5 text-center relative overflow-hidden">
    <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-64 h-32 bg-blue-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative space-y-5">
      <div class="space-y-1 font-mono">
        <div class="text-[9px] text-slate-500 uppercase tracking-wider">Round <span id="siRound">1</span></div>
        <div id="siTitle" class="text-sm font-black text-blue-200">—</div>
      </div>

      <div id="siItem" class="qmg-nosel py-5 font-mono font-black text-2xl sm:text-3xl text-white leading-tight">—</div>

      <div id="siButtons" class="grid gap-2"></div>
    </div>
  </div>

  <div class="flex items-center justify-between px-4 py-2.5 rounded-2xl bg-slate-950/80 border border-purple-500/20 font-mono text-[11px]">
    <span class="text-slate-400">Item <strong id="siProgress" class="text-cyan-300">1</strong>/<strong id="siTotal" class="text-cyan-300">0</strong></span>
    <span class="text-slate-400">Right: <strong id="siRight" class="text-emerald-300">0</strong></span>
    <span class="text-slate-400">Wrong: <strong id="siWrong" class="text-rose-300">0</strong></span>
  </div>
</div>
{% endblock %}

{% block game_js %}
<script>
(function () {
  var SETS = {{ sets|tojson }};
  var ROUND_SECONDS = 120;

  var titleEl = document.getElementById('siTitle');
  var itemEl = document.getElementById('siItem');
  var buttonsEl = document.getElementById('siButtons');
  var roundEl = document.getElementById('siRound');
  var progressEl = document.getElementById('siProgress');
  var totalEl = document.getElementById('siTotal');
  var rightEl = document.getElementById('siRight');
  var wrongEl = document.getElementById('siWrong');

  var setQueue = [];
  var itemQueue = [];
  var currentSet = null;
  var currentItem = null;
  var roundNo = 0;
  var right = 0, wrong = 0, done = 0, total = 0;
  var locked = false;
  var running = false;

  var BUTTON_STYLES = [
    'from-cyan-500 to-blue-700 border-cyan-400/40',
    'from-emerald-500 to-teal-700 border-emerald-400/40',
    'from-fuchsia-500 to-purple-700 border-fuchsia-400/40',
  ];

  function renderButtons() {
    buttonsEl.innerHTML = '';
    buttonsEl.className = 'grid gap-2 ' + (currentSet.buckets.length > 2 ? 'grid-cols-1' : 'grid-cols-2');
    currentSet.buckets.forEach(function (bucket, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.bucket = bucket;
      btn.className = 'py-4 rounded-2xl bg-gradient-to-r ' + BUTTON_STYLES[i % BUTTON_STYLES.length] +
        ' border-2 text-slate-950 font-mono font-black text-sm uppercase tracking-wider shadow-lg transition transform active:scale-95';
      btn.textContent = bucket;
      btn.addEventListener('click', function () { answer(bucket, btn); });
      buttonsEl.appendChild(btn);
    });
  }

  function answer(bucket, btn) {
    if (!running || locked || !currentItem) return;
    locked = true;
    done += 1;

    if (bucket === currentItem.bucket) {
      right += 1;
      rightEl.textContent = right;
      QMG.reward();
      var points = Math.round(60 * QMG.comboMultiplier());
      QMG.addScore(points, btn);
      QMG.audio.correct();
      QMG.haptic(20);
      QMG.flashOk(btn);
    } else {
      wrong += 1;
      wrongEl.textContent = wrong;
      QMG.resetCombo();
      QMG.audio.wrong();
      QMG.shake(itemEl);
      QMG.haptic(55);
      QMG.pop(btn, currentItem.bucket, 'bad');
    }

    setTimeout(function () { locked = false; nextItem(); }, 420);
  }

  function nextItem() {
    if (!itemQueue.length) { nextSet(); return; }
    currentItem = itemQueue.shift();
    itemEl.textContent = currentItem.label;
    itemEl.classList.remove('qmg-grow');
    void itemEl.offsetWidth;
    itemEl.classList.add('qmg-grow');
    progressEl.textContent = Math.min(done + 1, total);
  }

  function nextSet() {
    if (!setQueue.length) { finishUp(true); return; }
    roundNo += 1;
    roundEl.textContent = roundNo;
    currentSet = setQueue.shift();
    itemQueue = currentSet.items.slice();
    titleEl.textContent = currentSet.title;
    renderButtons();
    QMG.audio.switchTurn();
    nextItem();
  }

  function finishUp(cleared) {
    running = false;
    var accuracy = done ? Math.round(right / done * 100) : 0;
    QMG.finish({
      win: right > wrong,
      icon: cleared && wrong === 0 ? '🏆' : (right > wrong ? '🗂️' : '⏱️'),
      title: cleared && wrong === 0 ? 'Flawless Sorting!' : (cleared ? 'All Sorted' : 'Time Up'),
      sub: right + ' right, ' + wrong + ' wrong.',
      detail: ['Accuracy: ' + accuracy + '%']
    });
  }

  function start() {
    setQueue = QMG.shuffle(SETS);
    total = setQueue.reduce(function (n, s) { return n + s.items.length; }, 0);
    totalEl.textContent = total;
    right = 0; wrong = 0; done = 0; roundNo = 0;
    rightEl.textContent = '0';
    wrongEl.textContent = '0';
    locked = false;
    running = true;
    nextSet();
    QMG.startTimer(ROUND_SECONDS, function () { finishUp(false); });
  }

  QMG.onReplay(start);
  start();
})();
</script>
{% endblock %}
