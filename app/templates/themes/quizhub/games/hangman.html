{% extends "themes/quizhub/games/_shell.html" %}

{% block hud_mid_label %}Lives{% endblock %}
{% block hud_mid_value %}❤️ 6{% endblock %}

{% block game_stage %}
<div class="space-y-3">
  <div class="p-4 sm:p-6 rounded-3xl bg-slate-950/95 border-2 border-rose-500/35 shadow-2xl space-y-4 relative overflow-hidden">
    <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-64 h-32 bg-rose-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative space-y-4">
      <div class="flex items-center justify-between gap-2 font-mono">
        <span class="px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-200 text-[10px] font-black uppercase border border-rose-500/30">
          <span id="hmCategory">—</span>
        </span>
        <span class="text-[10px] text-slate-500 font-bold">Round <span id="hmRound">1</span></span>
      </div>

      <!-- Gallows -->
      <div class="flex justify-center">
        <svg viewBox="0 0 120 130" class="w-28 h-32 sm:w-32 sm:h-36" fill="none" stroke-width="4" stroke-linecap="round">
          <!-- frame -->
          <path d="M10 125 H70" stroke="#6d28d9"/>
          <path d="M28 125 V12" stroke="#6d28d9"/>
          <path d="M28 12 H88" stroke="#6d28d9"/>
          <path d="M88 12 V26" stroke="#6d28d9"/>
          <!-- body parts, revealed one per miss -->
          <circle id="hmHead" cx="88" cy="40" r="13" stroke="#fb7185" class="opacity-0 transition-opacity duration-300"/>
          <path id="hmBody" d="M88 53 V88" stroke="#fb7185" class="opacity-0 transition-opacity duration-300"/>
          <path id="hmArmL" d="M88 62 L70 78" stroke="#fb7185" class="opacity-0 transition-opacity duration-300"/>
          <path id="hmArmR" d="M88 62 L106 78" stroke="#fb7185" class="opacity-0 transition-opacity duration-300"/>
          <path id="hmLegL" d="M88 88 L72 112" stroke="#fb7185" class="opacity-0 transition-opacity duration-300"/>
          <path id="hmLegR" d="M88 88 L104 112" stroke="#fb7185" class="opacity-0 transition-opacity duration-300"/>
        </svg>
      </div>

      <!-- Phrase -->
      <div id="hmPhrase" class="flex flex-wrap justify-center gap-y-3 gap-x-3 min-h-[44px]"></div>
    </div>
  </div>

  <!-- Keyboard -->
  <div id="hmKeys" class="qmg-nosel grid grid-cols-7 sm:grid-cols-9 gap-1.5"></div>
</div>
{% endblock %}

{% block game_js %}
<script>
(function () {
  var BANK = {{ bank|tojson }};
  var MAX_LIVES = 6;
  var PARTS = ['hmHead', 'hmBody', 'hmArmL', 'hmArmR', 'hmLegL', 'hmLegR'];
  var ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  var phraseEl = document.getElementById('hmPhrase');
  var keysEl = document.getElementById('hmKeys');
  var catEl = document.getElementById('hmCategory');
  var roundEl = document.getElementById('hmRound');

  var queue = [];
  var current = null;
  var guessed = {};
  var lives = MAX_LIVES;
  var roundNo = 0;
  var running = false;

  function setLives(n) {
    lives = n;
    QMG.setMid('❤️ ' + Math.max(0, n));
    QMG.setMidBar(n / MAX_LIVES);
    PARTS.forEach(function (id, i) {
      var el = document.getElementById(id);
      if (el) el.classList.toggle('opacity-0', i >= (MAX_LIVES - n));
    });
  }

  function renderPhrase() {
    phraseEl.innerHTML = '';
    current.phrase.split(' ').forEach(function (word) {
      var group = document.createElement('div');
      group.className = 'flex gap-1';
      word.split('').forEach(function (ch) {
        var slot = document.createElement('span');
        var isLetter = /[A-Z]/.test(ch);
        var shown = !isLetter || guessed[ch];
        slot.className = 'w-6 h-9 sm:w-7 sm:h-10 flex items-center justify-center font-mono font-black text-base sm:text-lg ' +
          (isLetter ? 'border-b-2 ' + (shown ? 'border-emerald-400 text-emerald-300' : 'border-purple-500/50 text-transparent')
                    : 'text-slate-500');
        slot.textContent = shown ? ch : '•';
        if (!isLetter) slot.textContent = ch;
        group.appendChild(slot);
      });
      phraseEl.appendChild(group);
    });
  }

  function keyClass(state) {
    var base = 'h-10 rounded-xl font-mono font-black text-sm transition ';
    if (state === 'hit') return base + 'bg-emerald-500/90 text-slate-950';
    if (state === 'miss') return base + 'bg-slate-800 text-slate-600 line-through';
    return base + 'bg-slate-900 border border-purple-500/30 text-slate-200 active:bg-purple-900/70';
  }

  function renderKeys() {
    keysEl.innerHTML = '';
    ALPHABET.forEach(function (letter) {
      var btn = document.createElement('button');
      btn.type = 'button';
      var state = 'idle';
      if (guessed[letter]) { state = current.phrase.indexOf(letter) !== -1 ? 'hit' : 'miss'; }
      btn.className = keyClass(state);
      btn.textContent = letter;
      btn.disabled = !!guessed[letter];
      btn.addEventListener('click', function () { guess(letter, btn); });
      keysEl.appendChild(btn);
    });
  }

  function solved() {
    return current.phrase.split('').every(function (ch) {
      return !/[A-Z]/.test(ch) || guessed[ch];
    });
  }

  function guess(letter, btn) {
    if (!running || guessed[letter]) return;
    guessed[letter] = true;
    var hits = (current.phrase.match(new RegExp(letter, 'g')) || []).length;

    if (hits > 0) {
      QMG.reward();
      var points = Math.round(hits * 25 * QMG.comboMultiplier());
      QMG.addScore(points, btn);
      QMG.audio.correct();
      QMG.haptic(20);
    } else {
      QMG.resetCombo();
      setLives(lives - 1);
      QMG.audio.wrong();
      QMG.shake(phraseEl);
      QMG.haptic(60);
    }

    renderPhrase();
    renderKeys();

    if (solved()) {
      var bonus = 100 + lives * 50;
      QMG.addScore(bonus, phraseEl);
      QMG.pop(phraseEl, 'SOLVED +' + bonus, 'big');
      QMG.audio.victory();
      QMG.flashOk(phraseEl);
      running = false;
      setTimeout(nextRound, 1300);
    } else if (lives <= 0) {
      running = false;
      reveal();
      setTimeout(function () {
        QMG.finish({
          win: false,
          icon: '💀',
          title: 'Out Of Lives',
          sub: 'The answer was “' + current.phrase + '”.',
          detail: ['Phrases solved: ' + roundNo]
        });
      }, 1200);
    }
  }

  function reveal() {
    current.phrase.split('').forEach(function (ch) { if (/[A-Z]/.test(ch)) guessed[ch] = true; });
    renderPhrase();
    renderKeys();
  }

  function nextRound() {
    if (!queue.length) {
      QMG.finish({
        icon: '🏆',
        title: 'Bank Cleared!',
        sub: 'You solved every phrase we had. Remarkable.',
        detail: ['Phrases solved: ' + roundNo]
      });
      return;
    }
    roundNo += 1;
    roundEl.textContent = roundNo;
    current = queue.shift();
    current.phrase = current.phrase.toUpperCase();
    guessed = {};
    catEl.textContent = current.category;
    setLives(MAX_LIVES);
    renderPhrase();
    renderKeys();
    running = true;
    QMG.audio.switchTurn();
  }

  document.addEventListener('keydown', function (ev) {
    if (!running) return;
    var ch = (ev.key || '').toUpperCase();
    if (ch.length === 1 && ch >= 'A' && ch <= 'Z') { guess(ch, null); }
  });

  function start() {
    queue = QMG.shuffle(BANK);
    roundNo = 0;
    QMG.setMidLabel('Lives');
    nextRound();
  }

  QMG.onReplay(start);
  start();
})();
</script>
{% endblock %}
