<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wheelBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="50%" stop-color="#190e38" />
      <stop offset="100%" stop-color="#2d124d" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#190e38" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#wheelBgGrad)" />

  <!-- Ambient Glow Behind Wheel -->
  <circle cx="400" cy="300" r="280" fill="url(#centerGlow)" />

  <!-- Wheel Outer Glow Rim -->
  <circle cx="400" cy="300" r="236" fill="none" stroke="#a855f7" stroke-width="8" opacity="0.6" />
  <circle cx="400" cy="300" r="226" fill="url(#goldRim)" stroke="#fef08a" stroke-width="4" />
  <circle cx="400" cy="300" r="212" fill="#0f172a" />

  <!-- 8 Wheel Segments -->
  <g transform="translate(400, 300)">
    <!-- Seg 0: 50 Coins (Pink) -->
    <path d="M 0,0 L 210,0 A 210 210 0 0 1 148.49,148.49 Z" fill="#ec4899" opacity="0.9" />
    <!-- Seg 1: Shield (Cyan) -->
    <path d="M 0,0 L 148.49,148.49 A 210 210 0 0 1 0,210 Z" fill="#06b6d4" opacity="0.9" />
    <!-- Seg 2: 100 Coins (Purple) -->
    <path d="M 0,0 L 0,210 A 210 210 0 0 1 -148.49,148.49 Z" fill="#8b5cf6" opacity="0.9" />
    <!-- Seg 3: Double XP (Amber) -->
    <path d="M 0,0 L -148.49,148.49 A 210 210 0 0 1 -210,0 Z" fill="#f59e0b" opacity="0.9" />
    <!-- Seg 4: 250 Coins (Emerald) -->
    <path d="M 0,0 L -210,0 A 210 210 0 0 1 -148.49,-148.49 Z" fill="#10b981" opacity="0.9" />
    <!-- Seg 5: Mega Shield (Blue) -->
    <path d="M 0,0 L -148.49,-148.49 A 210 210 0 0 1 0,-210 Z" fill="#3b82f6" opacity="0.9" />
    <!-- Seg 6: JACKPOT 1000 Coins (Gold) -->
    <path d="M 0,0 L 0,-210 A 210 210 0 0 1 148.49,-148.49 Z" fill="#eab308" opacity="0.95" />
    <!-- Seg 7: 75 Coins (Rose) -->
    <path d="M 0,0 L 148.49,-148.49 A 210 210 0 0 1 210,0 Z" fill="#f43f5e" opacity="0.9" />

    <!-- Divider Spokes & Pegs -->
    <g stroke="#ffffff" stroke-width="3" opacity="0.8">
      <line x1="0" y1="0" x2="210" y2="0" />
      <line x1="0" y1="0" x2="148.49" y2="148.49" />
      <line x1="0" y1="0" x2="0" y2="210" />
      <line x1="0" y1="0" x2="-148.49" y2="148.49" />
      <line x1="0" y1="0" x2="-210" y2="0" />
      <line x1="0" y1="0" x2="-148.49" y2="-148.49" />
      <line x1="0" y1="0" x2="0" y2="-210" />
      <line x1="0" y1="0" x2="148.49" y2="-148.49" />
    </g>

    <!-- Outer Peg Dots -->
    <g fill="#fef08a" stroke="#854d0e" stroke-width="1.5">
      <circle cx="202" cy="0" r="5" />
      <circle cx="142" cy="142" r="5" />
      <circle cx="0" cy="202" r="5" />
      <circle cx="-142" cy="142" r="5" />
      <circle cx="-202" cy="0" r="5" />
      <circle cx="-142" cy="-142" r="5" />
      <circle cx="0" cy="-202" r="5" />
      <circle cx="142" cy="-142" r="5" />
    </g>

    <!-- Hub Center Vault Lock -->
    <circle cx="0" cy="0" r="62" fill="url(#goldRim)" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="52" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
    <text x="0" y="8" font-family="monospace" font-weight="900" font-size="24" fill="#fbbf24" text-anchor="middle">VAULT</text>
  </g>

  <!-- Top Indicator Arrow / Clapper Pin -->
  <g transform="translate(400, 72)">
    <polygon points="-16,-6 16,-6 0,28" fill="#ef4444" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="0" cy="-4" r="7" fill="#fbbf24" />
  </g>

  <!-- Floating Coins and Sparkles -->
  <g fill="#fbbf24" stroke="#b45309" stroke-width="2">
    <!-- Coin 1 -->
    <ellipse cx="140" cy="160" rx="26" ry="26" />
    <text x="140" y="167" font-family="sans-serif" font-weight="900" font-size="20" fill="#78350f" text-anchor="middle">🪙</text>
    <!-- Coin 2 -->
    <ellipse cx="660" cy="180" rx="22" ry="22" />
    <text x="660" y="186" font-family="sans-serif" font-weight="900" font-size="18" fill="#78350f" text-anchor="middle">🪙</text>
    <!-- Coin 3 -->
    <ellipse cx="680" cy="450" rx="28" ry="28" />
    <text x="680" y="458" font-family="sans-serif" font-weight="900" font-size="22" fill="#78350f" text-anchor="middle">🪙</text>
    <!-- Shield Icon -->
    <ellipse cx="120" cy="430" rx="24" ry="24" fill="#0284c7" stroke="#38bdf8" />
    <text x="120" y="438" font-family="sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">🛡️</text>
  </g>
</svg>
