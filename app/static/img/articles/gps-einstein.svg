<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a2e"/>
      <stop offset="55%" stop-color="#0a0620"/>
      <stop offset="100%" stop-color="#05030f"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0%" stop-color="#fbbf24" stop-opacity=".40"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".38"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="120" cy="70" rx="300" ry="210" fill="url(#glowA)"/>
  <ellipse cx="690" cy="390" rx="320" ry="220" fill="url(#glowB)"/>
  <text x="400" y="74" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="34" font-weight="bold" fill="#f8fafc">GPS Needs Einstein</text>
  <text x="400" y="104" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="16" fill="#94a3b8">Relativity keeps your sat-nav on the right road</text>
  <circle cx="250" cy="275" r="76" fill="#1d4ed8" opacity=".45" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="250" cy="275" r="126" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="360" y="210" width="24" height="14" rx="3" fill="#fbbf24"/>
  <line x1="344" y1="217" x2="400" y2="217" stroke="#22d3ee" stroke-width="4"/>
  <text x="455" y="220" font-family="Verdana,DejaVu Sans,sans-serif" font-size="34" font-weight="bold" fill="#fbbf24">+38 µs / day</text>
  <text x="455" y="250" font-family="Verdana,DejaVu Sans,sans-serif" font-size="14" fill="#cbd5e1">Satellite clocks run slightly faster</text>
  <text x="455" y="305" font-family="Verdana,DejaVu Sans,sans-serif" font-size="28" font-weight="bold" fill="#f472b6">~10 km drift</text>
  <text x="455" y="334" font-family="Verdana,DejaVu Sans,sans-serif" font-size="14" fill="#94a3b8">every single day without correction</text>
</svg>
