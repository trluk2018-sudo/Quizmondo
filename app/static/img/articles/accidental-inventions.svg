<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a2e"/>
      <stop offset="55%" stop-color="#0a0620"/>
      <stop offset="100%" stop-color="#05030f"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0%" stop-color="#fbbf24" stop-opacity=".40"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0%" stop-color="#34d399" stop-opacity=".38"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="120" cy="70" rx="300" ry="210" fill="url(#glowA)"/>
  <ellipse cx="690" cy="390" rx="320" ry="220" fill="url(#glowB)"/>
  <text x="400" y="74" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="34" font-weight="bold" fill="#f8fafc">Happy Accidents</text>
  <text x="400" y="104" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="16" fill="#94a3b8">Ten everyday things invented by mistake</text>
  <g font-family="Verdana,DejaVu Sans,sans-serif">
    <rect x="90" y="155" width="290" height="100" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="115" y="195" font-size="18" font-weight="bold" fill="#fbbf24">MICROWAVE OVEN</text>
    <text x="115" y="222" font-size="13" fill="#cbd5e1">Melted chocolate bar in a pocket</text>
    <rect x="420" y="155" width="290" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="445" y="195" font-size="18" font-weight="bold" fill="#34d399">PENICILLIN</text>
    <text x="445" y="222" font-size="13" fill="#cbd5e1">An unwashed petri dish on holiday</text>
    <rect x="90" y="280" width="290" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <text x="115" y="320" font-size="18" font-weight="bold" fill="#22d3ee">POST-IT NOTES</text>
    <text x="115" y="347" font-size="13" fill="#cbd5e1">A glue that refused to stick properly</text>
    <rect x="420" y="280" width="290" height="100" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
    <text x="445" y="320" font-size="18" font-weight="bold" fill="#f472b6">VELCRO</text>
    <text x="445" y="347" font-size="13" fill="#cbd5e1">Burdock burrs stuck to a dog's coat</text>
  </g>
</svg>
