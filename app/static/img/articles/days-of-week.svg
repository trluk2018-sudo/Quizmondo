<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a2e"/>
      <stop offset="55%" stop-color="#0a0620"/>
      <stop offset="100%" stop-color="#05030f"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0%" stop-color="#fbbf24" stop-opacity=".40"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0%" stop-color="#a855f7" stop-opacity=".38"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="120" cy="70" rx="300" ry="210" fill="url(#glowA)"/>
  <ellipse cx="690" cy="390" rx="320" ry="220" fill="url(#glowB)"/>
  <text x="54" y="70" font-family="Verdana,DejaVu Sans,sans-serif" font-size="38" font-weight="bold" fill="#f8fafc">Named After Gods</text>
  <text x="56" y="98" font-family="Verdana,DejaVu Sans,sans-serif" font-size="16" fill="#94a3b8">Six Norse and Germanic, one Roman</text>
  <circle cx="72" cy="144" r="7" fill="#22d3ee" fill-opacity=".55"/>
  <text x="96" y="150" font-family="Verdana,sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Sunday</text>
  <text x="300" y="150" font-family="Verdana,sans-serif" font-size="17" fill="#94a3b8">the Sun</text>
  <circle cx="72" cy="184" r="7" fill="#22d3ee" fill-opacity=".55"/>
  <text x="96" y="190" font-family="Verdana,sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Monday</text>
  <text x="300" y="190" font-family="Verdana,sans-serif" font-size="17" fill="#94a3b8">the Moon</text>
  <circle cx="72" cy="224" r="7" fill="#22d3ee" fill-opacity=".55"/>
  <text x="96" y="230" font-family="Verdana,sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Tuesday</text>
  <text x="300" y="230" font-family="Verdana,sans-serif" font-size="17" fill="#94a3b8">Tīw</text>
  <circle cx="72" cy="264" r="7" fill="#22d3ee" fill-opacity=".55"/>
  <text x="96" y="270" font-family="Verdana,sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Wednesday</text>
  <text x="300" y="270" font-family="Verdana,sans-serif" font-size="17" fill="#94a3b8">Wōden</text>
  <circle cx="72" cy="304" r="7" fill="#22d3ee" fill-opacity=".55"/>
  <text x="96" y="310" font-family="Verdana,sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Thursday</text>
  <text x="300" y="310" font-family="Verdana,sans-serif" font-size="17" fill="#94a3b8">Thunor</text>
  <circle cx="72" cy="344" r="7" fill="#22d3ee" fill-opacity=".55"/>
  <text x="96" y="350" font-family="Verdana,sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Friday</text>
  <text x="300" y="350" font-family="Verdana,sans-serif" font-size="17" fill="#94a3b8">Frige</text>
  <circle cx="72" cy="384" r="7" fill="#fbbf24" fill-opacity=".95"/>
  <text x="96" y="390" font-family="Verdana,sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Saturday</text>
  <text x="300" y="390" font-family="Verdana,sans-serif" font-size="17" fill="#fbbf24">Saturn</text>
  <text x="470" y="390" font-family="Verdana,sans-serif" font-size="14" fill="#fbbf24">&#8592; the only Roman one</text>

  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#fbbf24" stroke-opacity=".22"/>
</svg>
