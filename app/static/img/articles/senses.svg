<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a2e"/>
      <stop offset="55%" stop-color="#0a0620"/>
      <stop offset="100%" stop-color="#05030f"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".40"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0%" stop-color="#f472b6" stop-opacity=".38"/><stop offset="100%" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="120" cy="70" rx="300" ry="210" fill="url(#glowA)"/>
  <ellipse cx="690" cy="390" rx="320" ry="220" fill="url(#glowB)"/>
  <text x="400" y="74" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="36" font-weight="bold" fill="#f8fafc">Your Senses Are Lying</text>
  <text x="400" y="104" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="16" fill="#94a3b8">Perception is a reconstruction, not a recording</text>
  <path d="M200 270 Q400 140 600 270 Q400 400 200 270 Z" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="400" cy="270" r="62" fill="#1e1b4b" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="400" cy="270" r="26" fill="#05030f"/>
  <circle cx="418" cy="252" r="8" fill="#f8fafc" opacity=".7"/>
  <circle cx="520" cy="270" r="16" fill="#05030f" stroke="#f472b6" stroke-width="3" stroke-dasharray="5 4"/>
  <line x1="520" y1="254" x2="560" y2="200" stroke="#f472b6" stroke-width="2"/>
  <text x="566" y="196" font-family="Verdana,DejaVu Sans,sans-serif" font-size="15" fill="#f472b6" font-weight="bold" text-anchor="start">blind spot</text>

  <text x="566" y="218" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" fill="#94a3b8" font-weight="normal" text-anchor="start">painted over for you</text>

  <text x="200" y="378" font-family="Verdana,DejaVu Sans,sans-serif" font-size="14" fill="#cbd5e1" font-weight="normal" text-anchor="start">you also go blind every time your eyes move</text>

