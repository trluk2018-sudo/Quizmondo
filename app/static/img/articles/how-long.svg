  <text x="430" y="296" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" fill="#94a3b8" font-weight="normal" text-anchor="middle">93 million miles of nothing in the way</text>

  <circle cx="652" cy="268" r="22" fill="#1d4ed8" opacity=".85"/>
  <circle cx="652" cy="268" r="22" fill="none" stroke="#60a5fa" stroke-width="2"/>
