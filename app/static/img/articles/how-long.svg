<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a2e"/>
      <stop offset="55%" stop-color="#0a0620"/>
      <stop offset="100%" stop-color="#05030f"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0%" stop-color="#fbbf24" stop-opacity=".40"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".38"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="120" cy="70" rx="300" ry="210" fill="url(#glowA)"/>
  <ellipse cx="690" cy="390" rx="320" ry="220" fill="url(#glowB)"/>
  <text x="400" y="74" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="36" font-weight="bold" fill="#f8fafc">How Long It Really Takes</text>
  <text x="400" y="104" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="16" fill="#94a3b8">From eight minutes to three hundred million years</text>
  <circle cx="178" cy="268" r="92" fill="#f59e0b" opacity=".2"/>
  <circle cx="178" cy="268" r="62" fill="#fbbf24"/>
  <polyline points="178,268 173,258 177,246 178,242 166,243 153,241 141,229 139,239 128,231 132,243 134,240 147,228 157,222 147,211 142,220 133,222 137,219 138,206 126,198 131,196 126,199 125,193 133,199 126,201 126,211 133,205 146,195" fill="none" stroke="#b45309" stroke-width="2" opacity=".85"/>
  <text x="178" y="388" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" fill="#fbbf24" font-weight="normal" text-anchor="middle">tens of thousands of years</text>

  <text x="178" y="408" font-family="Verdana,DejaVu Sans,sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">core to surface</text>

