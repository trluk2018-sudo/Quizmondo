<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a2e"/>
      <stop offset="55%" stop-color="#0a0620"/>
      <stop offset="100%" stop-color="#05030f"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".40"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0%" stop-color="#fbbf24" stop-opacity=".38"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="120" cy="70" rx="300" ry="210" fill="url(#glowA)"/>
  <ellipse cx="690" cy="390" rx="320" ry="220" fill="url(#glowB)"/>
  <text x="400" y="74" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="36" font-weight="bold" fill="#f8fafc">Still Running</text>
  <text x="400" y="104" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="16" fill="#94a3b8">Science on a very long timescale</text>
  <line x1="150" y1="400" x2="650" y2="400" stroke="#334155" stroke-width="3"/>
  <line x1="168" y1="392" x2="168" y2="408" stroke="#22d3ee" stroke-width="3"/>
  <text x="168" y="430" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" fill="#94a3b8" font-weight="normal" text-anchor="middle">1840</text>

  <line x1="250" y1="392" x2="250" y2="408" stroke="#22d3ee" stroke-width="3"/>
  <text x="250" y="430" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" fill="#94a3b8" font-weight="normal" text-anchor="middle">1879</text>

  <line x1="352" y1="392" x2="352" y2="408" stroke="#22d3ee" stroke-width="3"/>
  <text x="352" y="430" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" fill="#94a3b8" font-weight="normal" text-anchor="middle">1927</text>

  <line x1="450" y1="392" x2="450" y2="408" stroke="#22d3ee" stroke-width="3"/>
  <text x="450" y="430" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" fill="#94a3b8" font-weight="normal" text-anchor="middle">1948</text>

  <line x1="520" y1="392" x2="520" y2="408" stroke="#22d3ee" stroke-width="3"/>
  <text x="520" y="430" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" fill="#94a3b8" font-weight="normal" text-anchor="middle">1958</text>

  <line x1="632" y1="392" x2="632" y2="408" stroke="#22d3ee" stroke-width="3"/>
  <text x="632" y="430" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" fill="#94a3b8" font-weight="normal" text-anchor="middle">now</text>

  <path d="M330 170 L430 170 L392 265 Q380 300 368 265 Z" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <path d="M336 178 L424 178 L390 262 Q380 286 370 262 Z" fill="#1c1917" opacity=".9"/>
  <ellipse cx="380" cy="300" rx="9" ry="13" fill="#1c1917" stroke="#fbbf24" stroke-width="2"/>
  <ellipse cx="380" cy="352" rx="13" ry="9" fill="#1c1917" stroke="#fbbf24" stroke-width="2" opacity=".55"/>
  <text x="470" y="210" font-family="Verdana,DejaVu Sans,sans-serif" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="start">nine drops</text>

  <text x="470" y="234" font-family="Verdana,DejaVu Sans,sans-serif" font-size="15" fill="#94a3b8" font-weight="normal" text-anchor="start">since 1927</text>

  <text x="470" y="262" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">nobody has seen one land</text>

