    <radialGradient id="glowB"><stop offset="0%" stop-color="#fb7185" stop-opacity=".38"/><stop offset="100%" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
