  <text x="400" y="366" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">0°C slows lithium ions to a crawl</text>
  <text x="400" y="394" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="14" fill="#94a3b8">Warm the phone up and the charge comes back</text>
