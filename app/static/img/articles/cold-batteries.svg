  <rect x="570" y="222" width="24" height="56" rx="6" fill="#38bdf8"/>
  <rect x="208" y="203" width="84" height="94" rx="8" fill="#fb7185"/>
  <rect x="304" y="203" width="84" height="94" rx="8" fill="#334155" opacity=".45"/>
