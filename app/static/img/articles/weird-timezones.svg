<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a2e"/>
      <stop offset="55%" stop-color="#0a0620"/>
      <stop offset="100%" stop-color="#05030f"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".40"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0%" stop-color="#a78bfa" stop-opacity=".38"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="120" cy="70" rx="300" ry="210" fill="url(#glowA)"/>
  <ellipse cx="690" cy="390" rx="320" ry="220" fill="url(#glowB)"/>
  <text x="400" y="74" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="34" font-weight="bold" fill="#f8fafc">Strangest Time Zones</text>
  <text x="400" y="104" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="16" fill="#94a3b8">Why Nepal is 45 minutes off — and China uses one clock</text>
  <g font-family="Verdana,DejaVu Sans,sans-serif" text-anchor="middle">
    <circle cx="200" cy="265" r="76" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
    <text x="200" y="260" font-size="24" font-weight="bold" fill="#22d3ee">+5:45</text>
    <text x="200" y="288" font-size="14" fill="#cbd5e1">Nepal</text>

    <circle cx="400" cy="265" r="76" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <text x="400" y="260" font-size="24" font-weight="bold" fill="#fbbf24">+14:00</text>
    <text x="400" y="288" font-size="14" fill="#cbd5e1">Kiribati</text>

    <circle cx="600" cy="265" r="76" fill="#0f172a" stroke="#f472b6" stroke-width="3"/>
    <text x="600" y="260" font-size="24" font-weight="bold" fill="#f472b6">+8:00</text>
    <text x="600" y="288" font-size="14" fill="#cbd5e1">All of China</text>
  </g>
  <text x="400" y="388" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="15" fill="#94a3b8">38 local times in a world with only 24 hours</text>
</svg>
