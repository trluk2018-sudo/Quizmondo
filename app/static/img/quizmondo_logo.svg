<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Background & Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="badge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="shield-inner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f0728" />
      <stop offset="100%" stop-color="#1e1045" />
    </linearGradient>

    <linearGradient id="lightning-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="text-quiz-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#b6c2d2" />
    </linearGradient>

    <linearGradient id="text-mondo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="dot-com-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9" />
    </linearGradient>

    <!-- Flying atom: nucleus plus two tilted electron shells -->
    <g id="qm-atom">
      <ellipse rx="13" ry="5" fill="none" stroke="#38bdf8" stroke-width="1.6" transform="rotate(28)" />
      <ellipse rx="13" ry="5" fill="none" stroke="#c084fc" stroke-width="1.6" transform="rotate(-52)" />
      <circle r="2.6" fill="#facc15" />
      <circle cx="11.5" cy="6.1" r="1.9" fill="#38bdf8" />
      <circle cx="-8" cy="-10.2" r="1.9" fill="#f472b6" />
    </g>
  </defs>

  <!-- ==================== LEFT ICON: 3D GAMING "Q" CREST ==================== -->
  <g transform="translate(15, 10)">
    <!-- Ambient back glow -->
    <circle cx="50" cy="50" r="46" fill="#8b5cf6" opacity="0.25" filter="url(#badge-glow)" />

    <!-- Outer Beveled Hexagon Shield -->
    <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" fill="url(#shield-grad)" filter="url(#neon-glow)" />
    <!-- Inner Dark Core -->
    <polygon points="50,10 84,29 84,71 50,90 16,71 16,29" fill="url(#shield-inner)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Planetary Orbital Ring (Angled 3D Arcade Orbit) -->
    <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="url(#ring-grad)" stroke-width="4" transform="rotate(-25 50 50)" filter="url(#neon-glow)" />
    <!-- Planet ring shadow/cut for 3D depth -->
    <path d="M 12 36 A 46 16 0 0 1 88 64" fill="none" stroke="#f59e0b" stroke-width="2" transform="rotate(-25 50 50)" />

    <!-- Central Stylized "Q" Core -->
    <circle cx="48" cy="46" r="21" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" />
    <circle cx="48" cy="46" r="14" fill="#0f0728" />

    <!-- Lightning Bolt Tail forming the 'Q' kick -->
    <polygon points="52,48 76,46 59,62 76,60 48,84 55,65 44,67" fill="url(#lightning-grad)" filter="url(#neon-glow)" />

    <!-- Arcade Sparkles / Highlights -->
    <polygon points="26,22 28,16 30,22 36,24 30,26 28,32 26,26 20,24" fill="#38bdf8" opacity="0.9" />
    <circle cx="78" cy="28" r="2.5" fill="#facc15" />
    <circle cx="22" cy="74" r="2" fill="#a855f7" />
  </g>

  <!-- ==================== LOGO TYPOGRAPHY: QUIZMONDO ==================== -->
  <g transform="translate(132, 22)">
    <!-- Subtitle Banner: LIVE TRIVIA ARENA -->
    <g transform="translate(4, 8)">
      <rect x="0" y="0" width="168" height="15" rx="4" fill="#1e1045" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="8" cy="7.5" r="3" fill="#06b6d4" />
      <text x="17" y="11" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="8.5" font-weight="900" fill="#38bdf8" letter-spacing="2">
        LIVE TRIVIA ARENA
      </text>
    </g>

    <!-- Wordmark: QUIZ and MONDO are one text run, so the join can never drift with
         the font that happens to load. textLength pins the overall width, which keeps
         a fallback like Arial Black condensed to roughly Impact's proportions. -->
    <text x="0" y="66" textLength="268" lengthAdjust="spacingAndGlyphs" font-family="'Impact', 'Haettenschweiler', 'Arial Narrow Bold', 'Montserrat', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="0" fill="none" stroke="#0b041c" stroke-width="6" stroke-linejoin="round">
      <tspan>QUIZ</tspan><tspan dx="4">MONDO</tspan>
    </text>
    <text x="0" y="66" textLength="268" lengthAdjust="spacingAndGlyphs" font-family="'Impact', 'Haettenschweiler', 'Arial Narrow Bold', 'Montserrat', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="0">
      <tspan fill="url(#text-quiz-grad)">QUIZ</tspan><tspan dx="4" fill="url(#text-mondo-grad)">MONDO</tspan>
    </text>

    <!-- Flying Atoms -->
    <use href="#qm-atom" transform="translate(296, 40)" filter="url(#neon-glow)" />
    <use href="#qm-atom" transform="translate(328, 16) scale(0.62)" opacity="0.75" />
    <use href="#qm-atom" transform="translate(326, 64) scale(0.5)" opacity="0.6" />

    <!-- Underline Cyber Rails with Glowing Nodes -->
    <path d="M 2 76 L 344 76" stroke="#8b5cf6" stroke-width="2.5" stroke-opacity="0.3" />
    <path d="M 2 76 L 140 76" stroke="url(#dot-com-grad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="140" cy="76" r="3" fill="#38bdf8" filter="url(#neon-glow)" />
    <circle cx="344" cy="76" r="2" fill="#8b5cf6" />
  </g>
</svg>
