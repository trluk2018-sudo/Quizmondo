<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <defs>
    <linearGradient id="tkw-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="tkw-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef3139" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="tkw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Emblem Symbol -->
  <g transform="translate(6, 6)" filter="url(#tkw-glow)">
    <path d="M32 2 L58 17 L58 47 L32 62 L6 47 L6 17 Z" fill="url(#tkw-grad-primary)" />
    <path d="M32 7 L53 19 L53 45 L32 57 L11 45 L11 19 Z" fill="#011c3d" opacity="0.9" />
    <path d="M20 22 H44 V27 H35 V44 H29 V27 H20 Z" fill="#ffffff" />
    <path d="M34 29 L45 22 H51 L39 34 L52 46 H45 L34 35 Z" fill="url(#tkw-grad-accent)" />
    <circle cx="32" cy="7" r="2" fill="#38bdf8" />
    <circle cx="53" cy="19" r="2" fill="#38bdf8" />
    <circle cx="53" cy="45" r="2" fill="#ef3139" />
    <circle cx="32" cy="57" r="2" fill="#ef3139" />
    <circle cx="11" cy="45" r="2" fill="#38bdf8" />
    <circle cx="11" cy="19" r="2" fill="#38bdf8" />
  </g>

  <!-- Logotype Typography -->
  <g transform="translate(80, 14)">
    <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.03em" fill="#ffffff">
      TEK<tspan fill="#ef3139">CLUB</tspan>
    </text>
    <g transform="translate(1, 35)">
      <rect x="0" y="0" width="86" height="17" rx="3.5" fill="#0f172a" stroke="#334155" stroke-width="0.75" />
      <circle cx="8" cy="8.5" r="2.5" fill="#10b981" />
      <text x="15" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em" fill="#e2e8f0">
        TK.CO.UK
      </text>
    </g>
    <text x="96" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#94a3b8" text-transform="uppercase">
      TECHNOLOGY &amp; CLOUD
    </text>
  </g>
