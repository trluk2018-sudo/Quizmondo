<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="farmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#04392b"/>
      <stop offset="100%" stop-color="#022118"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#farmBg)"/>
  <circle cx="520" cy="280" r="300" fill="url(#sunGlow)"/>

  <!-- Organic Bowl / Plate Base -->
  <ellipse cx="400" cy="420" rx="260" ry="90" fill="#03261c" stroke="#10b981" stroke-width="3" stroke-opacity="0.4"/>
  <ellipse cx="400" cy="405" rx="240" ry="75" fill="#f8fafc"/>

  <!-- Fresh Produce Elements in Bowl -->
  <!-- Avocado Half -->
  <g transform="translate(260, 310) rotate(-15)">
    <path d="M 0,60 C 0,10 30,0 50,0 C 70,0 100,10 100,60 C 100,110 70,130 50,130 C 30,130 0,110 0,60 Z" fill="#4d7c0f"/>
    <path d="M 10,60 C 10,20 35,12 50,12 C 65,12 90,20 90,60 C 90,100 65,118 50,118 C 35,118 10,100 10,60 Z" fill="#bef264"/>
    <circle cx="50" cy="75" r="26" fill="#78350f"/>
  </g>

  <!-- Cold-Pressed Green Juice Bottle -->
  <g transform="translate(450, 240)">
    <rect x="25" y="0" width="30" height="15" rx="3" fill="#15803d"/>
    <rect x="35" y="15" width="10" height="20" fill="#e2e8f0"/>
    <path d="M 10,50 L 70,50 L 75,180 C 75,190 65,195 55,195 L 25,195 C 15,195 5,190 5,180 Z" fill="#10b981" fill-opacity="0.9" stroke="#ffffff" stroke-width="2"/>
    <rect x="15" y="85" width="50" height="60" rx="4" fill="#ffffff" fill-opacity="0.95"/>
    <text x="22" y="105" font-family="system-ui, sans-serif" font-weight="900" font-size="8" fill="#064e3b" letter-spacing="1">VITAL</text>
    <text x="22" y="118" font-family="system-ui, sans-serif" font-weight="bold" font-size="7" fill="#10b981">COLD PRESSED</text>
    <text x="22" y="132" font-family="system-ui, sans-serif" font-weight="bold" font-size="6" fill="#64748b">100% ORGANIC</text>
  </g>

  <!-- Organic Leaves / Herbs -->
  <path d="M 330,300 C 310,240 370,220 410,240 C 420,280 370,310 330,300 Z" fill="url(#leafGrad)"/>
  <path d="M 350,280 C 370,220 430,210 460,250 C 450,290 390,300 350,280 Z" fill="#059669"/>

  <!-- Wild Blueberries -->
  <circle cx="390" cy="380" r="14" fill="#1e1b4b"/>
  <circle cx="415" cy="390" r="12" fill="#312e81"/>
  <circle cx="370" cy="395" r="13" fill="#1e1b4b"/>

  <!-- Floating Organic Nutrition Badges -->
  <g transform="translate(80, 140)">
    <rect width="180" height="70" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))"/>
    <circle cx="35" cy="35" r="18" fill="#d1fae5"/>
    <text x="27" y="42" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#059669">✓</text>
    <text x="65" y="30" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#064e3b">100% ORGANIC</text>
    <text x="65" y="48" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#64748b">Soil Association Certified</text>
  </g>

  <g transform="translate(540, 120)">
    <rect width="180" height="70" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))"/>
    <circle cx="35" cy="35" r="18" fill="#dcfce7"/>
    <text x="28" y="41" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#15803d">⚡</text>
    <text x="65" y="30" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#064e3b">FARM FRESH</text>
    <text x="65" y="48" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#64748b">Harvested within 48h</text>
  </g>

  <!-- Macro Strip Banner -->
  <g transform="translate(240, 500)">
    <rect width="320" height="48" rx="24" fill="#03261c" stroke="#10b981" stroke-width="1.5"/>
    <text x="35" y="29" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#34d399">420 KCAL</text>
    <circle cx="110" cy="24" r="3" fill="#10b981"/>
    <text x="130" y="29" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">22g PROTEIN</text>
    <circle cx="230" cy="24" r="3" fill="#10b981"/>
    <text x="250" y="29" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#34d399">0g SUGAR</text>
  </g>
</svg>