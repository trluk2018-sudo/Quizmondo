<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Montserrat, 'Arial Black', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090317"/><stop offset="55%" stop-color="#0b2545"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity=".5"/><stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="650" cy="300" r="210" fill="url(#orb)"/>
  <circle cx="140" cy="80" r="130" fill="url(#orb)" opacity=".45"/>

  <g stroke="#60a5fa" stroke-opacity=".13" stroke-width="1">
    <path d="M0 90 H800"/><path d="M0 200 H800"/><path d="M0 310 H800"/><path d="M0 420 H800"/>
    <path d="M160 0 V450"/><path d="M340 0 V450"/><path d="M520 0 V450"/><path d="M700 0 V450"/>
  </g>

  <g transform="translate(600,300)" opacity=".92">
    <text x="0" y="0" font-size="140" text-anchor="middle" dominant-baseline="middle">&#127988;</text>
  </g>

  <g transform="translate(56,160)">
    <rect x="0" y="-34" width="211" height="24" rx="6" fill="#fbbf24"/>
    <text x="11" y="-17" font-size="12" font-weight="900" fill="#0b041c" letter-spacing="1.6">FLAGS &amp; GEOGRAPHY</text>
    <text x="0" y="24" font-size="40" font-weight="900" fill="url(#ink)">Two identical flags</text>
    <text x="0" y="62" font-size="17" font-weight="500" fill="#60a5fa" opacity=".95">How Chad and Romania ended up matching</text>
    <rect x="0" y="86" width="86" height="5" rx="2.5" fill="#fbbf24"/>
  </g>

  <g transform="translate(56,398)" font-size="13" font-weight="700" fill="#cbd5e1" opacity=".7">
    <circle cx="5" cy="-4" r="5" fill="#fbbf24"/>
    <text x="20" y="0">quizmondo.com</text>
  </g>
</svg>
