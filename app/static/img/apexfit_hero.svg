<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="gymBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="gymSpot" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#gymBg)"/>
  <circle cx="400" cy="220" r="280" fill="url(#gymSpot)"/>

  <!-- Olympic Barbell Graphic -->
  <g transform="translate(100, 260)">
    <!-- Shaft -->
    <rect x="50" y="22" width="500" height="12" rx="4" fill="#71717a"/>
    <rect x="180" y="20" width="80" height="16" fill="#a1a1aa"/>
    <rect x="340" y="20" width="80" height="16" fill="#a1a1aa"/>

    <!-- Left Plates (Heavy Bumper 25kg) -->
    <rect x="90" y="-70" width="22" height="196" rx="6" fill="#f97316"/>
    <rect x="115" y="-60" width="18" height="176" rx="6" fill="#ea580c"/>
    <rect x="135" y="-50" width="16" height="156" rx="6" fill="#c2410c"/>
    <rect x="70" y="14" width="20" height="28" rx="3" fill="#3f3f46"/>

    <!-- Right Plates (Heavy Bumper 25kg) -->
    <rect x="488" y="-70" width="22" height="196" rx="6" fill="#f97316"/>
    <rect x="467" y="-60" width="18" height="176" rx="6" fill="#ea580c"/>
    <rect x="449" y="-50" width="16" height="156" rx="6" fill="#c2410c"/>
    <rect x="510" y="14" width="20" height="28" rx="3" fill="#3f3f46"/>
  </g>

  <!-- Kettlebell Left -->
  <g transform="translate(180, 370)">
    <circle cx="50" cy="70" r="45" fill="#27272a" stroke="#f97316" stroke-width="3"/>
    <path d="M 25,35 C 25,5 75,5 75,35" stroke="#f97316" stroke-width="12" stroke-linecap="round" fill="none"/>
    <text x="36" y="78" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff">32</text>
    <text x="40" y="94" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#f97316">KG</text>
  </g>

  <!-- Heart Rate Performance Badge Right -->
  <g transform="translate(480, 380)">
    <rect width="200" height="90" rx="16" fill="#18181b" stroke="#f97316" stroke-width="2"/>
    <path d="M 20,50 L 50,50 L 65,20 L 80,75 L 95,35 L 110,60 L 125,50 L 180,50" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff">ZONE 4 METABOLIC</text>
    <text x="140" y="80" font-family="monospace" font-weight="900" font-size="16" fill="#f97316">172 BPM</text>
  </g>

  <!-- Floating Stats Badges -->
  <g transform="translate(80, 100)">
    <rect width="180" height="60" rx="12" fill="#18181b" stroke="#f97316" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#f97316">40+ ELITE</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#a1a1aa" letter-spacing="1">OLYMPIC COACHES</text>
  </g>

  <g transform="translate(540, 100)">
    <rect width="180" height="60" rx="12" fill="#18181b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#22c55e">24/7 ACCESS</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#a1a1aa" letter-spacing="1">CRYO &amp; RECOVERY</text>
  </g>
</svg>