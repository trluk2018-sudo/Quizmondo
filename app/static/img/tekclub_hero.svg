  <!-- Floating SLA Badge -->
  <g transform="translate(80, 240)">
    <rect width="140" height="80" rx="12" fill="#0b1727" stroke="#ef3139" stroke-width="1.5"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#ef3139">15 MIN</text>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#ffffff">GUARANTEED SLA</text>
    <text x="20" y="66" font-family="monospace" font-size="9" fill="#94a3b8">24/7/365 NOC</text>
  </g>

  <!-- Floating Cloud Badge Right -->
  <g transform="translate(580, 240)">
    <rect width="140" height="80" rx="12" fill="#0b1727" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#38bdf8">450+</text>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#ffffff">MIGRATIONS</text>
    <text x="20" y="66" font-family="monospace" font-size="9" fill="#94a3b8">AWS / AZURE</text>
  </g>
