<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="corpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011c3d"/>
      <stop offset="50%" stop-color="#022d62"/>
      <stop offset="100%" stop-color="#000e21"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef3139"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#corpBg)"/>

  <!-- Enterprise Server Rack Cluster -->
  <g transform="translate(240, 120)">
    <!-- Main Rack Cabinet -->
    <rect width="320" height="340" rx="16" fill="#0b1727" stroke="#ef3139" stroke-width="2" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.6))"/>
    
    <!-- Rack Header -->
    <rect width="320" height="30" rx="16" fill="#1e293b"/>
    <rect y="16" width="320" height="14" fill="#1e293b"/>
    <text x="20" y="20" font-family="monospace" font-size="10" font-weight="bold" fill="#ef3139">TEK CLUB ENTERPRISE CLOUD • CLUSTER 01</text>
    <circle cx="295" cy="15" r="4" fill="#22c55e"/>

    <!-- 5 Server Blades -->
    {% for y, name in [(45, 'CORE-ROUTER-ALPHA'), (100, 'KUBERNETES-INGRESS'), (155, 'ZERO-TRUST-ENCLAVE'), (210, 'DATABASE-REPLICA-SYNC'), (265, 'TELEMETRY-STREAM-INGEST')] %}
    <g transform="translate(15, 45)">
      <rect width="290" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="20" cy="22" r="4" fill="#22c55e"/>
      <circle cx="35" cy="22" r="4" fill="#38bdf8"/>
      <rect x="55" y="14" width="80" height="6" rx="2" fill="#334155"/>
      <rect x="55" y="25" width="50" height="5" rx="2" fill="#1e293b"/>
      <text x="150" y="26" font-family="monospace" font-size="10" fill="#94a3b8">KUBE-NODE-01</text>
      <text x="250" y="26" font-family="monospace" font-size="10" font-weight="bold" fill="#22c55e">99.99%</text>
    </g>
    <g transform="translate(15, 100)">
      <rect width="290" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="20" cy="22" r="4" fill="#22c55e"/>
      <circle cx="35" cy="22" r="4" fill="#38bdf8"/>
      <rect x="55" y="14" width="80" height="6" rx="2" fill="#334155"/>
      <rect x="55" y="25" width="50" height="5" rx="2" fill="#1e293b"/>
      <text x="150" y="26" font-family="monospace" font-size="10" fill="#94a3b8">ZERO-TRUST-SOC</text>
      <text x="250" y="26" font-family="monospace" font-size="10" font-weight="bold" fill="#22c55e">ACTIVE</text>
    </g>
    <g transform="translate(15, 155)">
      <rect width="290" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="20" cy="22" r="4" fill="#22c55e"/>
      <circle cx="35" cy="22" r="4" fill="#38bdf8"/>
      <rect x="55" y="14" width="80" height="6" rx="2" fill="#334155"/>
      <rect x="55" y="25" width="50" height="5" rx="2" fill="#1e293b"/>
      <text x="150" y="26" font-family="monospace" font-size="10" fill="#94a3b8">STREAM-PIPELINE</text>
      <text x="250" y="26" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">&lt;10MS</text>
    </g>
    <g transform="translate(15, 210)">
      <rect width="290" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="20" cy="22" r="4" fill="#22c55e"/>
      <circle cx="35" cy="22" r="4" fill="#38bdf8"/>
      <rect x="55" y="14" width="80" height="6" rx="2" fill="#334155"/>
      <rect x="55" y="25" width="50" height="5" rx="2" fill="#1e293b"/>
      <text x="150" y="26" font-family="monospace" font-size="10" fill="#94a3b8">POSTGRES-REPLICA</text>
      <text x="250" y="26" font-family="monospace" font-size="10" font-weight="bold" fill="#22c55e">SYNCED</text>
    </g>
    <g transform="translate(15, 265)">
      <rect width="290" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="20" cy="22" r="4" fill="#22c55e"/>
      <circle cx="35" cy="22" r="4" fill="#38bdf8"/>
      <rect x="55" y="14" width="80" height="6" rx="2" fill="#334155"/>
      <rect x="55" y="25" width="50" height="5" rx="2" fill="#1e293b"/>
      <text x="150" y="26" font-family="monospace" font-size="10" fill="#94a3b8">ISO-27001-AUDIT</text>
      <text x="250" y="26" font-family="monospace" font-size="10" font-weight="bold" fill="#22c55e">PASSED</text>
